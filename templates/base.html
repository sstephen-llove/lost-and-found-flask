<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Lost & Found{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
  <div class="bg-orbs" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="School logo">
        <div class="brand-text">
          <div class="brand-title">North Forsyth High School</div>
          <div class="brand-subtitle">Lost &amp; Found • Raider Nation</div>
        </div>
      </a>

      <div class="nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('report') }}">Report Item</a>
        <a href="{{ url_for('admin_login') }}">Admin</a>
      </div>
    </nav>
  </header>

  <main class="container fade-in">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 School Lost &amp; Found • Built for students</p>
    </div>
  </footer>
</body>
</html>
