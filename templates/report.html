{% extends "base.html" %}
{% block title %}Report • Lost & Found{% endblock %}

{% block content %}
<section class="hero">
  <div class="badges">
    <span class="badge"><span class="dot"></span> Report an Item</span>
    <span class="badge">Staff will approve before posting</span>
  </div>

  <h1>Report a Found Item</h1>
  <p>Fill this out and an admin will review it. Once approved, it will appear on the home page.</p>
</section>

<div class="form-card" style="margin-top:16px;">
  <form method="POST" enctype="multipart/form-data">
    <label for="name">Item Name</label>
    <input id="name" name="name" placeholder="e.g., Gray hoodie" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" placeholder="Brand, color, size, any identifying details..." required></textarea>

    <label for="location">Location Found</label>
    <input id="location" name="location" placeholder="e.g., 800 Hallway, Gym, Cafeteria" required>

    <label for="date_found">Date Found</label>
    <input id="date_found" type="date" name="date_found" required>

    <label for="photo">Upload Photo (optional)</label>
    <input id="photo" type="file" name="photo" accept="image/*">

    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Submit</button>
      <a class="btn" href="{{ url_for('home') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
